<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera web en la nube</title>
  
  <!-- Fuente tipográfica moderna (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Enlace a los estilos -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="card">
    <!-- Badge de estado en la nube -->
    <div class="badge">
      <span class="pulse"></span>
      <span>Desplegado en la Nube</span>
    </div>

    <!-- Encabezado principal -->
    <h1>Hola, soy <span class="highlight">Philipoh20</span> 👋</h1>
    
    <!-- Subtítulo profesional -->
    <p class="subtitle">
      Estudiante de <strong>Ingeniería de Sistemas</strong> · Electiva Cloud Computing
    </p>

    <!-- Caja informativa inferior -->
    <div class="cloud-status">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.5 19s2-1.5 2-3a2.5 2.5 0 0 0-4.13-1.87 2.1 2.1 0 0 0-2.37-.13"/>
        <path d="M17.5 19a5 5 0 1 0-8.6-4.3 4 4 0 1 0-6.4 5.3 5 5 0 0 0 9 2.5"/>
      </svg>
      <span>Esta página está desplegada y activa en la nube.</span>
    </div>
  </main>

</body>
</html>
